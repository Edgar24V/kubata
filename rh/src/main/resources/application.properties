spring.application.name=kubata-rh
# Perfil padrão é sqlite (Desenvolvimento)
# Para produção: -Dspring.profiles.active=prod
spring.profiles.active=sqlite

# As configurações de banco, JPA e Flyway são definidas por perfil em:
# - application-sqlite.properties (Dev)
# - application-test.properties (Testes)
# - application-prod.properties (Produção - PostgreSQL)

# Configurações de Segurança
kubata.security.password-expiry-days=90
kubata.security.max-login-attempts=5
kubata.security.lockout-minutes=15

# Timeouts para evitar erros de conexão
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configurações de Proxy
# O sistema detecta automaticamente o proxy do Windows (recomendado)
# Descomente as linhas abaixo apenas se precisar de proxy manual específico
spring.mail.proxy.enabled=false
# spring.mail.proxy.host=proxy.empresa.ao
# spring.mail.proxy.port=8080
# spring.mail.proxy.username=usuario_proxy
# spring.mail.proxy.password=senha_proxy

# Retry e fallback
spring.mail.enabled=true
spring.mail.retry.max=3

# Configurações Padrão da Empresa (Fallback se não existir no banco)
kubata.empresa.nome=KUBATA SOFT
kubata.empresa.nif=5417012345
kubata.empresa.endereco=Rua da Liberdade, 10
kubata.empresa.cidade=Luanda

# Configurações específicas do RH
rh.config.max-dias-ferias-por-pedido=30
rh.config.max-horas-extra-por-dia=4
rh.config.dias-aviso-contrato-expirar=60
