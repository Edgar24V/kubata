# Configuração SQLite com suporte a múltiplos usuários e concorrência
spring.datasource.url=jdbc:sqlite:kubata.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON&shared_cache=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuração de Pool de Conexões (HikariCP) para SQLite
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=KubataRhSQLitePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
