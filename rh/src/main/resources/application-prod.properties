spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kubata_prod}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:kubata}
spring.datasource.password=${DB_PASSWORD:senha_producao}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:kubata}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=${DB_SCHEMA:kubata}
spring.flyway.schemas=${DB_SCHEMA:kubata}
