<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Document Base -->
  <rect x="25" y="22" width="50" height="56" rx="4" fill="white" opacity="0.95"/>
  
  <!-- K Letter / Kubata Branding -->
  <text x="50" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="url(#grad1)" text-anchor="middle" dominant-baseline="central">K</text>
  
  <!-- Invoice Lines (representando fatura) -->
  <rect x="32" y="58" width="36" height="3" rx="1.5" fill="#c7d2fe"/>
  <rect x="32" y="65" width="28" height="3" rx="1.5" fill="#c7d2fe"/>
  <rect x="32" y="72" width="20" height="3" rx="1.5" fill="#ddd6fe"/>
  
  <!-- Dollar/Amount Symbol -->
  <circle cx="70" cy="32" r="10" fill="url(#grad2)"/>
  <text x="70" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">$</text>
  
  <!-- Corner Accent -->
  <path d="M 65 22 L 75 22 L 75 32" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
