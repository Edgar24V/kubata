spring.application.name=kubata-faturacao
# Perfil padrão é sqlite (Desenvolvimento)
# Para produção: -Dspring.profiles.active=prod
spring.profiles.active=sqlite

# As configurações de banco, JPA e Flyway são definidas por perfil em:
# - application-sqlite.properties (Dev)
# - application-test.properties (Testes)
# - application-prod.properties (Produção - PostgreSQL)



# Configurações de Segurança
kubata.security.password-expiry-days=90
kubata.security.max-login-attempts=5
kubata.security.lockout-minutes=15

# Timeouts para evitar erros de conexão
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configurações de Proxy
# O sistema detecta automaticamente o proxy do Windows (recomendado)
# Descomente as linhas abaixo apenas se precisar de proxy manual específico
spring.mail.proxy.enabled=false
# spring.mail.proxy.host=proxy.empresa.ao
# spring.mail.proxy.port=8080
# spring.mail.proxy.username=usuario_proxy
# spring.mail.password=senha_proxy

# Retry e fallback
spring.mail.enabled=true
spring.mail.retry.max=3

# spring.mail.username=noreply@kubata.ao

# Configurações Padrão da Empresa (Fallback se não existir no banco)
kubata.empresa.nome=KUBATA SOFT
kubata.empresa.nif=5417012345
kubata.empresa.endereco=Rua da Liberdade, 10
kubata.empresa.cidade=Luanda

# ===========================================
# CONFIGURAÇÕES AGT - Decreto 683/25
# ===========================================

# URL da API AGT (Ambiente de Produção)
# Sandbox: https://api.sandbox.agt.minfin.gov.ao/v1
agt.api.url=https://api.agt.minfin.gov.ao/v1

# Chave de API AGT (Obter no portal AGT)
agt.api.key=${KUBATA_AGT_API_KEY:SEU_API_KEY_AQUI}

# Ativa/Desativa envio real para AGT (modo simulação quando false)
agt.api.enabled=${KUBATA_AGT_API_ENABLED:false}

# Número de identificação fiscal da empresa (9-10 dígitos)
agt.empresa.nif=5417012345

# Nome da empresa (igual ao registro comercial)
agt.empresa.nome=KUBATA SOFT, LDA

# Código de Atividade Económica (EAC) - 4 dígitos
agt.empresa.eac=1234

# País do emitente (AO para Angola)
agt.empresa.country=AO

# Tax Registration Country (AO para Angola)
agt.empresa.taxCountry=AO

# Timeout para requisições (em segundos)
agt.api.timeout=30

# Retry em caso de falha
agt.api.retry.max=3

# ===========================================
# CONFIGURAÇÕES CERTIFICADO DIGITAL
# ===========================================

# Caminho do certificado digital (formato PKCS12)
# Exemplo: file:///C:/certificados/certificado.p12
# Ou classpath:certificado.p12
agt.certificado.path=

# Senha do certificado
agt.certificado.password=

# Tipo de assinatura: HMAC_SHA256 ou RSA_SHA256
agt.assinatura.tipo=${KUBATA_AGT_SIGNATURE_TYPE:HMAC_SHA256}

# Chave secreta para HMAC (em produção, usar keystore seguro)
# Esta chave deve ser gerada/obtida junto com o certificado AGT
agt.assinatura.chave=${KUBATA_AGT_HMAC_KEY:chave_secreta_desenvolvimento_apenas}
