spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}

# Faturação electrónica: produção não permite simulação nem assinaturas de desenvolvimento.
agt.api.url=${KUBATA_AGT_API_URL:https://sifp.minfin.gov.ao/sigt/fe/v1}
agt.api.username=${KUBATA_AGT_API_USERNAME:}
agt.api.password=${KUBATA_AGT_API_PASSWORD:}
agt.api.enabled=${KUBATA_AGT_API_ENABLED:false}
agt.api.simulation-enabled=false
agt.enforce-production-readiness=true
agt.allow-development-signatures=false
agt.assinatura.tipo=${KUBATA_AGT_SIGNATURE_TYPE:RSA_SHA256}
agt.certificado.path=${KUBATA_AGT_CERTIFICATE_PATH:}
agt.certificado.password=${KUBATA_AGT_CERTIFICATE_PASSWORD:}
agt.software.validation-number=${KUBATA_AGT_SOFTWARE_VALIDATION_NUMBER:}
agt.emitter.nif=${KUBATA_AGT_EMITTER_NIF:}
agt.emitter.company-name=${KUBATA_AGT_EMITTER_COMPANY_NAME:}
agt.empresa.nif=${KUBATA_AGT_EMITTER_NIF:}
agt.empresa.nome=${KUBATA_AGT_EMITTER_COMPANY_NAME:}
