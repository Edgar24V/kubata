# Configuração para Testes de Migração PostgreSQL (usando H2 em modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb_pg;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
faturacao.data-initializer.enabled=false
kubata.core.data-initializer.enabled=false

# Este perfil é um smoke test JDBC/Flyway em H2 PostgreSQL; não valida o esquema JPA
# global do Core/Admin, que contém entidades de outros módulos.
# Flyway - PostgreSQL Scripts
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=false
