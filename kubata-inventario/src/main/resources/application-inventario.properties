spring.application.name=kubata-inventario

spring.datasource.url=jdbc:sqlite:kubata.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON&shared_cache=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=KubataInventarioSQLitePool
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=false

kubata.security.password-expiry-days=90
kubata.security.max-login-attempts=5
kubata.security.lockout-minutes=15
