# Base de dados partilhada por todas as aplicações Kubata (Administrator, Faturação, RH).
# Substituível pela variável de ambiente KUBATA_DB_PATH ou por -Dkubata.db.path=...
spring.datasource.url=jdbc:sqlite:${KUBATA_DB_PATH:${user.home}/Kubata/kubata.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# WAL permite várias ligações de leitura. A sincronização do catálogo trata SQLITE_BUSY_SNAPSHOT
# reiniciando a transacção; shared_cache é evitado para reduzir conflitos entre ligações.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.pool-name=KubataAdminSQLitePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.encoding=UTF-8
