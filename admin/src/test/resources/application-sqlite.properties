# Isolamento P0: os testes do Administrator nunca devem abrir a base de dados de produção.
# Maven executa os testes a partir do módulo admin; "target" é removido por "mvn clean".
spring.datasource.url=jdbc:sqlite:target/kubata-admin-test.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&foreign_keys=ON
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.pool-name=KubataAdminTestSQLitePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=15000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.encoding=UTF-8
