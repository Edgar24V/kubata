# Configuração SQLite exclusiva dos testes do Administrator.
# O ficheiro fica em target/ para não partilhar a base de produção kubata.db.
spring.datasource.url=jdbc:sqlite:target/kubata-admin-test.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=30000&foreign_keys=ON
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Os testes de integração partilham o mesmo contexto/BD; uma ligação evita
# concorrência de escrita entre Flyway, sincronização de módulos e JPA.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=KubataAdminTestSQLitePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.encoding=UTF-8
