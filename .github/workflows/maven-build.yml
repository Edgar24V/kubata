name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main", "develop", "feat/*", "feature/*" ]

jobs:
  admin-p0-tests:
    name: Administrator P0 integration tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Test Admin and its module dependencies
      run: mvn -B -pl admin -am clean test

  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kubata-administrator
        path: admin/target/*.jar
